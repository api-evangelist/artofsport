aid: artofsport
name: Artofsport
description: >-
  Art of Sport is a consumer personal-care brand offering a complete line of daily body and skin care
  products made for athletes, including aluminum-free deodorant, antiperspirant, charcoal shampoo and body
  wash, bar soap, sunscreen, and hair care. Products are formulated with high-performance skincare science,
  fresh scents, clean formulas, and natural botanical ingredients. The company sells direct-to-consumer
  through a Shopify-powered e-commerce storefront at artofsport.com as well as retail distribution. It was
  surfaced in the API Evangelist network as a portfolio company of Lightspeed Venture Partners. Art of Sport
  does not publish a first-party developer API; its only machine surface is the Shopify Customer Accounts
  OpenID Connect / OAuth authorization server exposed at the storefront host.
